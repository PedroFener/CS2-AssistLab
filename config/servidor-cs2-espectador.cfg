// Ajustes do servidor dedicado para assistir partidas com o radar GSI.
// Copie para game/csgo/cfg/ no servidor e rode no console:  exec servidor-cs2-espectador
// Nenhum plugin é necessário: o radar usa o GSI do cliente espectador / GOTV.

sv_password ""              // defina uma senha para manter a partida privada
mp_forcecamera 0            // espectadores podem acompanhar qualquer jogador
tv_enable 1                 // GOTV ligada (o admin pode assistir por ela)
tv_delay 0                  // sem atraso: útil em treino; use atraso em partidas oficiais
tv_advertise_watchable 0

// Bots para testar o radar
bot_quota_mode normal
bot_difficulty 2
bot_add_t
bot_add_t
bot_add_ct
bot_add_ct
