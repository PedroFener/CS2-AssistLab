"AssistLab GSI"
{
    // Troque o token abaixo pelo mesmo configurado no app (ou em GSI_TOKEN).
    // O app gera esse arquivo já preenchido em "Arquivo de configuração do CS2".
    "uri"       "http://127.0.0.1:3010/gsi"
    "timeout"   "1.0"
    "buffer"    "0.0"
    "throttle"  "0.05"
    "heartbeat" "10.0"
    "auth"
    {
        "token" "TROQUE_ESTE_TOKEN"
    }
    "output"
    {
        "precision_time"     "3"
        "precision_position" "1"
        "precision_vector"   "3"
    }
    "data"
    {
        "provider"               "1"
        "map"                    "1"
        "round"                  "1"
        "player_id"              "1"
        "player_state"           "1"
        "player_position"        "1"
        "allplayers_id"          "1"
        "allplayers_state"       "1"
        "allplayers_match_stats" "1"
        "allplayers_position"    "1"
        "phase_countdowns"       "1"
    }
}
